<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♠ Blackjack Game ♠</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">♠</span>
                <h1>Blackjack</h1>
            </div>
            <button class="btn btn-new-game" id="btn-new-game">
                <span class="btn-icon">↻</span>
                Нова гра
            </button>
        </header>

        <!-- Main Game Area -->
        <main class="game-area">
            <!-- Player 1 Section -->
            <section class="player-section player-1" id="player-1">
                <div class="player-header">
                    <div class="player-info">
                        <div class="player-avatar">1</div>
                        <div class="player-details">
                            <h2 class="player-name">Гравець 1</h2>
                            <span class="player-status" id="status-1">Очікування...</span>
                        </div>
                    </div>
                    <div class="score-display">
                        <span class="score-label">Очки</span>
                        <span class="score-value" id="score-1">0</span>
                    </div>
                </div>
                
                <div class="cards-area" id="cards-1">
                    <!-- Cards will be added here via JavaScript -->
                    <div class="card-placeholder">
                        <span>♠</span>
                    </div>
                </div>

                <div class="player-actions">
                    <button class="btn btn-hit" id="hit-1" disabled>
                        <span class="btn-icon">+</span>
                        Взяти карту
                    </button>
                    <button class="btn btn-stand" id="stand-1" disabled>
                        <span class="btn-icon">✓</span>
                        Стоп
                    </button>
                </div>
            </section>

            <!-- Center Divider -->
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-badge">
                    <span class="target-label">Ціль</span>
                    <span class="target-value">21</span>
                </div>
                <div class="divider-line"></div>
            </div>

            <!-- Player 2 Section -->
            <section class="player-section player-2" id="player-2">
                <div class="player-header">
                    <div class="player-info">
                        <div class="player-avatar">2</div>
                        <div class="player-details">
                            <h2 class="player-name">Гравець 2</h2>
                            <span class="player-status" id="status-2">Очікування...</span>
                        </div>
                    </div>
                    <div class="score-display">
                        <span class="score-label">Очки</span>
                        <span class="score-value" id="score-2">0</span>
                    </div>
                </div>
                
                <div class="cards-area" id="cards-2">
                    <!-- Cards will be added here via JavaScript -->
                    <div class="card-placeholder">
                        <span>♥</span>
                    </div>
                </div>

                <div class="player-actions">
                    <button class="btn btn-hit" id="hit-2" disabled>
                        <span class="btn-icon">+</span>
                        Взяти карту
                    </button>
                    <button class="btn btn-stand" id="stand-2" disabled>
                        <span class="btn-icon">✓</span>
                        Стоп
                    </button>
                </div>
            </section>
        </main>

        <!-- Winner Modal (hidden by default) -->
        <div class="modal hidden" id="winner-modal">
            <div class="modal-content">
                <div class="modal-icon">🏆</div>
                <h2 class="modal-title" id="winner-text">Гравець 1 переміг!</h2>
                <p class="modal-subtitle" id="winner-score">21 очок</p>
                <button class="btn btn-play-again" id="btn-play-again">
                    Грати знову
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Blackjack — ближче до 21 очок, не перевищивши!</p>
        </footer>
    </div>

    <!-- 
    ==========================================
    CARD TEMPLATES (for JavaScript reference)
    ==========================================
    
    Приклад карти (копіюйте в cards-area через JS):
    
    <div class="card card-red">
        <div class="card-corner card-top">
            <span class="card-value">K</span>
            <span class="card-suit">♥</span>
        </div>
        <div class="card-center">
            <span class="card-suit-big">♥</span>
        </div>
        <div class="card-corner card-bottom">
            <span class="card-value">K</span>
            <span class="card-suit">♥</span>
        </div>
    </div>
    
    Кольори:
    - card-red: для ♥ і ♦
    - card-black: для ♠ і ♣
    
    ==========================================
    -->

    <script src="script.js"></script>
</body>
</html>
