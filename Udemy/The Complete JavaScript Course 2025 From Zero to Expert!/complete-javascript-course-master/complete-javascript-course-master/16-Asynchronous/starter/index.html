<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <title>League of Legends Analyzer</title>
  </head>
  <body>
    <main class="container">
      <!-- Блок пошуку героя та скіна -->
      <div class="search-box">
        <input
          type="text"
          class="search-input"
          placeholder="Ім'я (напр. Ahri)"
        />
        <input type="text" class="skin-input" placeholder="Скін (напр. K/DA)" />
        <button class="search-btn">Знайти</button>
      </div>

      <!-- Контейнер, куди JS буде малювати картки -->
      <div class="champions"></div>
    </main>
  </body>
</html>
